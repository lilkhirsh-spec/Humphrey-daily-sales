<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humphrey's Daily Sales</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#EFEDE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Sales">
<style>
  :root {
    --paper: #FBFAF6;
    --ink: #23221E;
    --ink-soft: #524F47;
    --ink-faint: #7C7A70;
    --stamp: #B23A2E;
    --stamp-soft: #E9D3D0;
    --settled: #2E5E3F;
    --settled-soft: #DCE7DE;
    --line: rgba(35, 34, 30, 0.14);
    --glass: rgba(255, 255, 255, 0.4);
    --glass-strong: rgba(255, 255, 255, 0.6);
    --glass-border: rgba(255, 255, 255, 0.55);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 24px 14px 60px;
    min-height: 100vh;
    background: linear-gradient(125deg, #FF9A8B, #FFC876, #8BD8FF, #B79CFF, #FF9AD5);
    background-size: 300% 300%;
    animation: driftGlass 18s ease-in-out infinite;
    font-family: 'Courier New', ui-monospace, monospace;
    color: var(--ink);
    display: flex;
    justify-content: center;
  }
  @keyframes driftGlass {
    0% { background-position: 0% 30%; }
    50% { background-position: 100% 70%; }
    100% { background-position: 0% 30%; }
  }
  @media (prefers-reduced-motion: reduce) {
    body { animation: none; }
  }
  .receipt {
    width: 100%;
    max-width: 380px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 26px;
    box-shadow:
      0 12px 40px rgba(31, 20, 60, 0.18),
      inset 0 1px 0 rgba(255,255,255,0.7),
      inset 0 -1px 0 rgba(255,255,255,0.15);
    padding: 26px 20px 20px;
    position: relative;
  }
  header {
    text-align: center;
    margin-bottom: 16px;
    font-family: -apple-system, system-ui, sans-serif;
  }
  header .label {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--ink-faint);
    text-transform: uppercase;
  }
  header h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 4px 0 6px;
    letter-spacing: 0.5px;
  }
  header .date {
    font-size: 12px;
    color: var(--ink-soft);
  }
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    background: rgba(255,255,255,0.3);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 18px;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .tab-btn {
    border: none;
    background: transparent;
    padding: 9px 0;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    border-radius: 10px;
    cursor: pointer;
  }
  .tab-btn.active {
    background: rgba(35, 34, 30, 0.85);
    color: var(--paper);
  }
  .view { display: none; }
  .view.active { display: block; }
  .divider {
    border: none;
    border-top: 1px dashed var(--line);
    margin: 16px 0;
  }
  .entry-form {
    display: grid;
    grid-template-columns: 1fr 52px 68px;
    gap: 8px;
    align-items: end;
    margin-bottom: 6px;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .field label {
    display: block;
    font-size: 10px;
    color: var(--ink-faint);
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .field input {
    width: 100%;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.55);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    padding: 8px 7px;
    font-size: 13px;
    font-family: -apple-system, system-ui, sans-serif;
    color: var(--ink);
    border-radius: 10px;
  }
  .field input:focus {
    outline: none;
    border-color: var(--ink-soft);
    background: rgba(255,255,255,0.75);
  }
  .add-btn {
    width: 100%;
    padding: 11px 0;
    background: rgba(35, 34, 30, 0.82);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: var(--paper);
    border: 1px solid rgba(255,255,255,0.25);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 4px;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .add-btn:active { transform: scale(0.98); }
  .error-msg {
    color: var(--stamp);
    font-size: 11px;
    margin: 4px 0 0;
    font-family: -apple-system, system-ui, sans-serif;
    min-height: 14px;
  }
  .line-items {
    margin: 18px 0 0;
    min-height: 20px;
  }
  .line-item {
    display: grid;
    grid-template-columns: 1fr auto 20px;
    gap: 8px;
    font-size: 13px;
    padding: 9px 8px;
    margin-bottom: 6px;
    background: rgba(255,255,255,0.28);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 10px;
    align-items: center;
  }
  .line-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line-item .qtyprice { color: var(--ink-soft); font-size: 11px; }
  .line-item .amt { text-align: right; font-weight: 700; }
  .line-item .del {
    color: var(--ink-faint);
    text-align: center;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    background: none;
    border: none;
    padding: 4px;
  }
  .empty-note {
    text-align: center;
    color: var(--ink-faint);
    font-size: 12px;
    padding: 20px 0;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .totals {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 2px solid rgba(35, 34, 30, 0.35);
  }
  .totals-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 2px 0;
  }
  .totals-row.grand {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    padding-top: 6px;
  }
  .finalize-btn {
    width: 100%;
    margin-top: 18px;
    padding: 14px 0;
    background: rgba(178, 58, 46, 0.82);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    border-radius: 14px;
    cursor: pointer;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .finalize-btn:active { transform: scale(0.98); }
  .finalize-btn:disabled {
    background: rgba(124, 122, 112, 0.5);
    cursor: default;
  }
  .stamp {
    text-align: center;
    margin: 18px 0 4px;
    padding: 14px 0;
    background: rgba(220, 231, 222, 0.45);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border: 2px solid rgba(46, 94, 63, 0.7);
    color: var(--settled);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 3px;
    transform: rotate(-2deg);
    border-radius: 14px;
  }
  .stamp .sub {
    display: block;
    font-size: 10px;
    letter-spacing: 1px;
    margin-top: 4px;
    font-weight: 400;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .edit-btn {
    width: 100%;
    margin-top: 10px;
    padding: 11px 0;
    background: rgba(255,255,255,0.4);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: var(--ink);
    border: 1px solid var(--glass-border);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    border-radius: 12px;
    cursor: pointer;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .edit-btn:active { transform: scale(0.98); }
  .history-summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: rgba(255,255,255,0.3);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 10px 12px;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .stat-card .k { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.5px; text-transform: uppercase; }
  .stat-card .v { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .hist-day {
    background: rgba(255,255,255,0.28);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 12px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .hist-day-head {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px;
    align-items: center;
    padding: 11px 12px;
    cursor: pointer;
    font-size: 12px;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .hist-day-head .d { color: var(--ink-soft); }
  .hist-day-head .t { font-weight: 700; font-size: 14px; }
  .hist-day-head .del-day {
    color: var(--stamp);
    background: none;
    border: none;
    font-size: 14px;
    padding: 4px 6px;
    cursor: pointer;
  }
  .hist-detail {
    display: none;
    padding: 0 12px 12px;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .hist-detail.open { display: block; }
  .hist-detail div { padding: 3px 0; display: flex; justify-content: space-between; border-top: 1px dotted var(--line); }
  .hist-detail div:first-child { border-top: none; }
  .status-line {
    text-align: center;
    font-size: 10px;
    color: var(--ink-faint);
    padding: 14px 0 4px;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .confirm-box {
    background: rgba(255,255,255,0.5);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 12px;
  }
  .confirm-box .btns { display: flex; gap: 8px; margin-top: 8px; }
  .confirm-box button {
    flex: 1;
    padding: 8px 0;
    border-radius: 8px;
    border: 1px solid var(--glass-border);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .confirm-box .yes { background: var(--stamp); color: #fff; border-color: transparent; }
  .confirm-box .no { background: rgba(255,255,255,0.5); color: var(--ink); }
</style>
</head>
<body>

<div class="receipt">
  <header>
    <div class="label">Humphrey's Daily Sales</div>
    <h1 id="today-date">—</h1>
    <div class="date" id="today-weekday">—</div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tab-today">Today</button>
    <button class="tab-btn" id="tab-history">Past records</button>
  </div>

  <div class="view active" id="view-today">
    <div id="entry-section">
      <div class="entry-form">
        <div class="field">
          <label for="f-item">Item</label>
          <input type="text" id="f-item" placeholder="e.g. Cake slice" />
        </div>
        <div class="field">
          <label for="f-qty">Qty</label>
          <input type="number" id="f-qty" placeholder="1" min="0" step="1" />
        </div>
        <div class="field">
          <label for="f-price">Price</label>
          <input type="number" id="f-price" placeholder="0.00" min="0" step="0.01" />
        </div>
      </div>
      <div class="error-msg" id="form-error"></div>
      <button class="add-btn" id="add-btn">+ Add sale</button>
    </div>

    <hr class="divider" />

    <div class="line-items" id="line-items">
      <div class="empty-note">No sales recorded yet today.</div>
    </div>

    <div class="totals">
      <div class="totals-row"><span>Items sold</span><span id="items-count">0</span></div>
      <div class="totals-row grand"><span>Total</span><span id="grand-total">0.00</span></div>
    </div>

    <button class="finalize-btn" id="finalize-btn" disabled>Finalize today's sales</button>
    <div id="stamp-area"></div>
    <div id="edit-area"></div>

    <div class="status-line" id="status-line">Loading...</div>
  </div>

  <div class="view" id="view-history">
    <div class="history-summary">
      <div class="stat-card">
        <div class="k">Days recorded</div>
        <div class="v" id="hist-days-count">0</div>
      </div>
      <div class="stat-card">
        <div class="k">All-time total</div>
        <div class="v" id="hist-alltime-total">0.00</div>
      </div>
    </div>
    <div id="history-list"></div>
  </div>
</div>

<script>
(function() {
  const todayKey = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  };
  const fmt = n => Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const DKEY = todayKey();
  const STORE_KEY = 'ledger:' + DKEY;
  const HIST_INDEX_KEY = 'ledger:history-index';

  let state = { entries: [], finalized: false, finalTotal: 0, finalizedAt: null };
  let pendingDeleteDay = null;

  const els = {
    date: document.getElementById('today-date'),
    weekday: document.getElementById('today-weekday'),
    item: document.getElementById('f-item'),
    qty: document.getElementById('f-qty'),
    price: document.getElementById('f-price'),
    error: document.getElementById('form-error'),
    addBtn: document.getElementById('add-btn'),
    lineItems: document.getElementById('line-items'),
    itemsCount: document.getElementById('items-count'),
    grandTotal: document.getElementById('grand-total'),
    finalizeBtn: document.getElementById('finalize-btn'),
    stampArea: document.getElementById('stamp-area'),
    editArea: document.getElementById('edit-area'),
    entrySection: document.getElementById('entry-section'),
    status: document.getElementById('status-line'),
    tabToday: document.getElementById('tab-today'),
    tabHistory: document.getElementById('tab-history'),
    viewToday: document.getElementById('view-today'),
    viewHistory: document.getElementById('view-history'),
    historyList: document.getElementById('history-list'),
    histDaysCount: document.getElementById('hist-days-count'),
    histAlltimeTotal: document.getElementById('hist-alltime-total'),
  };

  const now = new Date();
  els.date.textContent = now.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  els.weekday.textContent = now.toLocaleDateString(undefined, { weekday: 'long' });

  function switchTab(tab) {
    if (tab === 'today') {
      els.tabToday.classList.add('active');
      els.tabHistory.classList.remove('active');
      els.viewToday.classList.add('active');
      els.viewHistory.classList.remove('active');
    } else {
      els.tabToday.classList.remove('active');
      els.tabHistory.classList.add('active');
      els.viewToday.classList.remove('active');
      els.viewHistory.classList.add('active');
      pendingDeleteDay = null;
      loadHistoryIndex();
    }
  }
  els.tabToday.addEventListener('click', () => switchTab('today'));
  els.tabHistory.addEventListener('click', () => switchTab('history'));

  async function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      els.status.textContent = 'Saved on this device';
    } catch (e) {
      els.status.textContent = 'Could not save — try again';
    }
  }

  async function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) state = JSON.parse(raw);
    } catch (e) {
      // no entry yet for today, keep default state
    }
    render();
  }

  function total() {
    return state.entries.reduce((sum, e) => sum + e.qty * e.price, 0);
  }

  function render() {
    if (state.finalized) {
      els.entrySection.style.display = 'none';
      els.finalizeBtn.style.display = 'none';
      els.stampArea.innerHTML =
        '<div class="stamp">SETTLED<span class="sub">' +
        new Date(state.finalizedAt).toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'}) +
        '</span></div>';
      els.editArea.innerHTML = '<button class="edit-btn" id="unlock-btn">Made a mistake? Unlock and edit</button>';
      document.getElementById('unlock-btn').addEventListener('click', unfinalizeDay);
    } else {
      els.entrySection.style.display = '';
      els.finalizeBtn.style.display = '';
      els.stampArea.innerHTML = '';
      els.editArea.innerHTML = '';
      els.finalizeBtn.disabled = state.entries.length === 0;
    }

    if (state.entries.length === 0) {
      els.lineItems.innerHTML = '<div class="empty-note">No sales recorded yet today.</div>';
    } else {
      els.lineItems.innerHTML = state.entries.map(e => `
        <div class="line-item">
          <div>
            <div class="name">${escapeHtml(e.item)}</div>
            <div class="qtyprice">${e.qty} × ${fmt(e.price)}</div>
          </div>
          <div class="amt">${fmt(e.qty * e.price)}</div>
          ${state.finalized ? '<span></span>' : `<button class="del" data-id="${e.id}" aria-label="Remove ${escapeHtml(e.item)}">×</button>`}
        </div>
      `).join('');
    }

    els.itemsCount.textContent = state.entries.reduce((s,e) => s + Number(e.qty), 0);
    els.grandTotal.textContent = fmt(total());

    document.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', () => removeEntry(btn.dataset.id));
    });
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function addEntry() {
    const item = els.item.value.trim();
    const qty = parseFloat(els.qty.value);
    const price = parseFloat(els.price.value);

    if (!item) { showError('Enter an item name first'); return; }
    if (!qty || qty <= 0) { showError('Enter a quantity greater than 0'); return; }
    if (isNaN(price) || price < 0) { showError('Enter a valid price'); return; }

    showError('');
    state.entries.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), item, qty, price });
    els.item.value = '';
    els.qty.value = '';
    els.price.value = '';
    els.item.focus();
    render();
    save();
  }

  function showError(msg) {
    els.error.textContent = msg;
  }

  function removeEntry(id) {
    state.entries = state.entries.filter(e => e.id !== id);
    render();
    save();
  }

  async function finalizeDay() {
    if (state.entries.length === 0) return;
    state.finalized = true;
    state.finalTotal = total();
    state.finalizedAt = new Date().toISOString();
    render();
    await save();
    await addToHistoryIndex(DKEY);
  }

  function unfinalizeDay() {
    state.finalized = false;
    render();
    save();
  }

  async function addToHistoryIndex(key) {
    try {
      let idx = [];
      try {
        const raw = localStorage.getItem(HIST_INDEX_KEY);
        if (raw) idx = JSON.parse(raw);
      } catch (e) { idx = []; }
      if (!idx.includes(key)) {
        idx.unshift(key);
        localStorage.setItem(HIST_INDEX_KEY, JSON.stringify(idx));
      }
    } catch (e) {
      // history index best-effort
    }
  }

  function deleteHistoryDay(key) {
    try {
      localStorage.removeItem('ledger:' + key);
      let idx = [];
      const raw = localStorage.getItem(HIST_INDEX_KEY);
      if (raw) idx = JSON.parse(raw);
      idx = idx.filter(k => k !== key);
      localStorage.setItem(HIST_INDEX_KEY, JSON.stringify(idx));
    } catch (e) {}
    pendingDeleteDay = null;
    if (key === DKEY) {
      state = { entries: [], finalized: false, finalTotal: 0, finalizedAt: null };
      render();
    }
    loadHistoryIndex();
  }

  async function loadHistoryIndex() {
    try {
      const raw = localStorage.getItem(HIST_INDEX_KEY);
      const idx = raw ? JSON.parse(raw) : [];
      if (idx.length === 0) {
        els.historyList.innerHTML = '<div class="empty-note">No past records yet. Finalize a day to see it here.</div>';
        els.histDaysCount.textContent = '0';
        els.histAlltimeTotal.textContent = fmt(0);
        return;
      }
      const rows = idx.map(k => {
        try {
          const raw2 = localStorage.getItem('ledger:' + k);
          if (!raw2) return null;
          const d = JSON.parse(raw2);
          if (!d.finalized) return null;
          return { key: k, total: d.finalTotal, entries: d.entries };
        } catch (e) { return null; }
      }).filter(Boolean);

      if (rows.length === 0) {
        els.historyList.innerHTML = '<div class="empty-note">No past records yet. Finalize a day to see it here.</div>';
        els.histDaysCount.textContent = '0';
        els.histAlltimeTotal.textContent = fmt(0);
        return;
      }

      els.histDaysCount.textContent = rows.length;
      els.histAlltimeTotal.textContent = fmt(rows.reduce((s, r) => s + r.total, 0));

      els.historyList.innerHTML = rows.map(v => `
        <div class="hist-day">
          <div class="hist-day-head" data-key="${v.key}">
            <span class="d">${new Date(v.key).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'})}</span>
            <span class="t">${fmt(v.total)}</span>
            <button class="del-day" data-key="${v.key}" aria-label="Delete this record">🗑</button>
          </div>
          <div class="hist-detail" id="detail-${v.key}">
            ${v.entries.map(e => `<div><span>${escapeHtml(e.item)} (${e.qty}×${fmt(e.price)})</span><span>${fmt(e.qty*e.price)}</span></div>`).join('')}
            <div id="confirm-${v.key}"></div>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.hist-day-head .d, .hist-day-head .t').forEach(el => {
        el.addEventListener('click', () => {
          const key = el.closest('.hist-day-head').dataset.key;
          document.getElementById('detail-' + key).classList.toggle('open');
        });
      });

      document.querySelectorAll('.del-day').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const key = btn.dataset.key;
          document.getElementById('detail-' + key).classList.add('open');
          const box = document.getElementById('confirm-' + key);
          box.innerHTML = `
            <div class="confirm-box">
              Delete this day's record? This can't be undone.
              <div class="btns">
                <button class="no">Cancel</button>
                <button class="yes">Delete</button>
              </div>
            </div>`;
          box.querySelector('.no').addEventListener('click', () => { box.innerHTML = ''; });
          box.querySelector('.yes').addEventListener('click', () => deleteHistoryDay(key));
        });
      });
    } catch (e) {
      els.historyList.innerHTML = '<div class="empty-note">Could not load history.</div>';
    }
  }

  els.addBtn.addEventListener('click', addEntry);
  [els.item, els.qty, els.price].forEach(inp => {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') addEntry(); });
    inp.addEventListener('input', () => showError(''));
  });
  els.finalizeBtn.addEventListener('click', finalizeDay);

  load();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>

</body>
</html>
